name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - run: npm run check
      - run: npm run demo
      - run: npm run build:cloudflare
      - name: Install the browser for account and slow-loading regressions
        run: npx playwright install --with-deps chromium
      - name: Exercise the Cloudflare runtime and private storage
        run: |
          export SENDA_TEST_STATE="$(mktemp -d)"
          npx wrangler d1 migrations apply senda --local --persist-to "$SENDA_TEST_STATE"
          npx wrangler dev --config dist-cloudflare/server/wrangler.json --ip 127.0.0.1 --port 8788 --infer-origin-from-routes=false --persist-to "$SENDA_TEST_STATE" --var LOCAL_EMAIL_OUTBOX:1 --var BETTER_AUTH_SECRET:senda-ci-test-secret-not-used-in-production > "$SENDA_TEST_STATE/worker.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8788/health >/dev/null; then break; fi
            sleep 1
          done
          node scripts/test-cloudflare-workflow.js
          node scripts/test-cloudflare-browser.js
