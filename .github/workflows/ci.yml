name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
# One run per ref at a time. Other refs cancel older runs. On main a running
# run (and its deploy) is never cancelled: a newer push waits for it, and
# GitHub keeps only one waiting run, so a still newer push replaces the waiting
# one. The running deploy always finishes and an older commit never deploys
# after a newer one, but not every commit on main is deployed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - run: npm run check
      - run: npm run demo -- --no-open
      - run: npm run build:cloudflare
      - name: Install the browser for account and slow-loading regressions
        run: npx playwright install --with-deps chromium
      - name: Check assistant setup and clipboard behavior
        run: node --test test/connection-guidance.browser.js
      - name: Exercise the Cloudflare runtime and private storage
        run: |
          export SENDA_TEST_STATE="$(mktemp -d)"
          npx wrangler d1 migrations apply senda --local --persist-to "$SENDA_TEST_STATE"
          npx wrangler dev --config dist-cloudflare/server/wrangler.json --ip 127.0.0.1 --port 8788 --infer-origin-from-routes=false --persist-to "$SENDA_TEST_STATE" --var LOCAL_EMAIL_OUTBOX:1 --var GOOGLE_CLIENT_ID:senda-local-test-client --var GOOGLE_CLIENT_SECRET:senda-local-test-client-secret --var BETTER_AUTH_SECRET:senda-ci-test-secret-not-used-in-production > "$SENDA_TEST_STATE/worker.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8788/health >/dev/null; then break; fi
            sleep 1
          done
          node scripts/test-cloudflare-workflow.js
          node scripts/test-cloudflare-browser.js

  # Production deploys only from here, after every test leg passes on main.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:cloudflare
      - name: Apply pending D1 migrations
        run: npx wrangler d1 migrations apply senda --remote
      - name: Deploy the Worker
        run: npm run deploy:cloudflare
